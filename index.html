<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Task Manager with Priority & Confetti</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar / Header Area -->
        <header class="app-header">
            <div class="header-title">
                <i class="fa-solid fa-list-check logo-icon"></i>
                <div>
                    <h1>Task Master</h1>
                    <p>Organize your day efficiently</p>
                </div>
            </div>
            <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Progress Card -->
        <div class="progress-card">
            <div class="progress-info">
                <span>Completion Status</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Input Section -->
        <form id="todoForm" class="todo-form">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add a new task..." required>
                <div class="input-details">
                    <select id="categorySelect">
                        <option value="Personal">👤 Personal</option>
                        <option value="Work">💼 Work</option>
                        <option value="Study">📚 Study</option>
                        <option value="Health">❤️ Health</option>
                    </select>
                    <select id="prioritySelect">
                        <option value="Low">🟢 Low</option>
                        <option value="Medium" selected>🟡 Medium</option>
                        <option value="High">🔴 High</option>
                    </select>
                    <input type="date" id="dueDateInput">
                </div>
            </div>
            <button type="submit" class="add-btn">
                <i class="fa-solid fa-plus"></i> Add Task
            </button>
        </form>

        <!-- Filters & Search -->
        <div class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search tasks...">
            </div>
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="task-list"></ul>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <i class="fa-regular fa-clipboard"></i>
            <p>No tasks found. Relax or add a new task!</p>
        </div>

        <!-- Footer Stats & Actions -->
        <footer class="app-footer">
            <span id="taskStats">0 tasks remaining</span>
            <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
